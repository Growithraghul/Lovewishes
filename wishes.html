<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Happy Birthday 💖</title><link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--p1:#ffe3ec;--p2:#ffc2d6;--p3:#ff9fbd;--ink:#7a1f3d;--red:#d94452;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--p1),var(--p2) 55%,var(--p3));background-attachment:fixed}
.page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
.page.on{opacity:1;pointer-events:auto;transform:none}
.page{animation:in .9s both}@keyframes in{from{opacity:0;transform:scale(.96)}}
h1{font-family:'Dancing Script',cursive;font-size:2.4rem;line-height:1.15}
.hint{margin-top:14px;font-size:.95rem;opacity:.75;animation:fade 2s infinite}
@keyframes fade{50%{opacity:.25}}
#env{position:relative;width:min(86vw,380px);cursor:pointer}
#env img{width:100%;display:block;filter:drop-shadow(0 12px 14px rgba(122,31,61,.25))}
#env svg{position:absolute;left:36.5%;top:27%;width:26%;animation:beat 1.1s infinite;transform-origin:50% 55%}
@keyframes beat{0%,50%,100%{transform:scale(1)}12%{transform:scale(1.22)}28%{transform:scale(1.05)}38%{transform:scale(1.16)}}
#cake{width:170px;margin:6px 0}
.fl{animation:fl .25s infinite alternate;transform-origin:50% 100%}
@keyframes fl{to{transform:scale(1.15,.85) rotate(4deg)}}
#quote{min-height:78px;margin:12px 0 18px;font-size:1.02rem;line-height:1.6;max-width:320px;transition:opacity .6s}
.btn{border:0;border-radius:40px;padding:13px 32px;font:500 1.05rem Poppins,sans-serif;color:#fff;background:linear-gradient(135deg,#ff6f96,var(--red));box-shadow:0 8px 20px rgba(217,68,82,.4);cursor:pointer}
.btn:active{transform:scale(.96)}
.rise{position:fixed;bottom:-30px;pointer-events:none;animation:up linear forwards;z-index:5}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
#track{display:flex;gap:0;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 0;scrollbar-width:none;perspective:900px}
#track::-webkit-scrollbar{display:none}
.card{flex:0 0 62vw;max-width:290px;height:min(58vh,430px);margin:0 4vw;border-radius:26px;scroll-snap-align:center;display:flex;align-items:flex-end;justify-content:center;padding:16px;color:#fff;font-weight:500;background-size:cover;background-position:center;box-shadow:0 14px 28px rgba(122,31,61,.3);transition:transform .25s,opacity .25s}
.card:first-child{margin-left:19vw}.card:last-child{margin-right:19vw}
.nav{display:flex;align-items:center;gap:22px;margin-top:6px}
.nav button{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--ink);background:rgba(255,255,255,.5);color:var(--ink);font-size:1.3rem}
#cap{min-width:120px;font-family:'Dancing Script',cursive;font-size:1.6rem}
#mus{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:9;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.65);font-size:1.1rem;display:none}
</style></head><body>
<button id="mus" aria-label="music">🎵</button><audio id="bgm" loop></audio>
<section class="page on">
  <h1 id="wish">Happy Birthday,<br><span id="nm"></span> 🎉</h1>
  <svg id="cake" viewBox="0 0 170 150">
    <g class="fl"><path d="M85 8c8 10 7 18 0 22-7-4-8-12 0-22z" fill="#ffb200"/></g>
    <rect x="81" y="28" width="8" height="28" rx="3" fill="#fff"/>
    <rect x="25" y="56" width="120" height="34" rx="10" fill="#ff8fb1"/>
    <path d="M25 66q15 14 30 0t30 0 30 0 30 0v-4H25z" fill="#fff"/>
    <rect x="10" y="90" width="150" height="44" rx="12" fill="#ffc9da"/>
    <path d="M10 102q19 16 38 0t38 0 37 0 37 0v-6H10z" fill="#fff"/>
    <circle cx="50" cy="118" r="5" fill="#d94452"/><circle cx="85" cy="122" r="5" fill="#d94452"/><circle cx="120" cy="118" r="5" fill="#d94452"/>
    <rect x="4" y="134" width="162" height="8" rx="4" fill="#ff6f96"/></svg>
  <p id="quote"></p>
  <button class="btn" id="memBtn">Memories 💞</button>
</section><script>
const NAME="My Love";      // her name
const MUSIC="";            // e.g. "music.mp3" (put the file in the same folder)
const $=id=>document.getElementById(id);
const bgm=$('bgm'),mus=$('mus');
function hearts(n){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='rise';s.textContent=['💖','💗','🎈','✨','🌸'][i%5];s.style.left=Math.random()*95+'vw';s.style.fontSize=14+Math.random()*22+'px';s.style.animationDuration=3+Math.random()*3+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),6500)}}
if(MUSIC){bgm.src=MUSIC;mus.style.display='block';
 try{bgm.currentTime=+sessionStorage.t||0;if(sessionStorage.on==='1')bgm.play().catch(()=>{})}catch(e){}
 mus.onclick=()=>{bgm.paused?bgm.play():bgm.pause()};
 bgm.onplay=()=>{try{sessionStorage.on='1'}catch(e){}};bgm.onpause=()=>{try{sessionStorage.on='0'}catch(e){}};
 setInterval(()=>{try{sessionStorage.t=bgm.currentTime}catch(e){}},500)}
function go(u){setTimeout(()=>location.href=u,600)}
const QUOTES=["Nee irukkura idam dhaan en home, chellam. 🏡","Un smile paartha pothum, en day complete aagidum. 😊","Ennoda ella naalum, unnoda irundha dhaan azhagu. 💕","Evlo jenmam vandhalum, unna dhaan thedi varuven. ♾️","Un kooda irukkura ovvoru nimishamum en birthday gift. 🎁"];
$('nm').textContent=NAME;hearts(24);
let q=0;function qi(){const e=$('quote');e.style.opacity=0;setTimeout(()=>{e.textContent=QUOTES[q++%QUOTES.length];e.style.opacity=1},500)}
qi();setInterval(qi,4500);
$('memBtn').onclick=()=>{hearts(16);go('memories.html')};</script></body></html>
